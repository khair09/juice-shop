.github/workflows/devsecops.yml
name: DevSecOps Pipeline - OWASP Juice Shop

# Trigger the pipeline on every push to main/master and on pull requests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # Allow manual triggering from the Actions tab

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/juice-shop

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: SAST - Static Application Security Testing (SonarQube)
  # ─────────────────────────────────────────────────────────────
  sast-sonarqube:
    name: SAST - SonarQube Cloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history required for SonarQube blame

      - name: Run SonarQube Cloud Analysis
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ─────────────────────────────────────────────────────────────
  # JOB 2: SCA - Software Composition Analysis (Snyk)
  # ─────────────────────────────────────────────────────────────
  sca-snyk:
    name: SCA - Snyk Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Authenticate Snyk
        run: npx snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk dependency scan
        run: |
          npx snyk test --json > snyk-report.json || true
          npx snyk monitor
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload Snyk report
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: snyk-report.json

  # ─────────────────────────────────────────────────────────────
  # JOB 3: File System Scan (Trivy FS)
  # ─────────────────────────────────────────────────────────────
  trivy-fs-scan:
    name: File System Scan - Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run Trivy file system scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-fs-report.txt'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'    # Don't fail the build on findings

      - name: Upload Trivy FS report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs-report.txt

  # ─────────────────────────────────────────────────────────────
  # JOB 4: Generate SBOM (CycloneDX)
  # ─────────────────────────────────────────────────────────────
  sbom-cyclonedx:
    name: SBOM - CycloneDX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Install CycloneDX
        run: npm install -g @cyclonedx/cyclonedx-npm

      - name: Generate SBOM
        run: cyclonedx-npm --output-file sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.json

  # ─────────────────────────────────────────────────────────────
  # JOB 5: Docker Build, Push & Container Scan
  # ─────────────────────────────────────────────────────────────
  docker-build-scan:
    name: Docker Build, Push & Container Scan
    runs-on: ubuntu-latest
    needs: [sca-snyk, trivy-fs-scan]  # Run after dependency scans
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run Trivy container image scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: '${{ env.DOCKER_IMAGE }}:latest'
          format: 'table'
          output: 'trivy-image-report.txt'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy image report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image-report.txt

  # ─────────────────────────────────────────────────────────────
  # JOB 6: DAST - Dynamic Application Security Testing (OWASP ZAP)
  # ─────────────────────────────────────────────────────────────
  dast-owasp-zap:
    name: DAST - OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    needs: docker-build-scan
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Pull and start Juice Shop container
        run: |
          docker pull ${{ env.DOCKER_IMAGE }}:latest
          docker run -d --name juice-shop \
            -p 3000:3000 \
            ${{ env.DOCKER_IMAGE }}:latest

      - name: Wait for application to be ready
        run: |
          echo 'Waiting for Juice Shop to start...'
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo 'Application is up!'
              break
            fi
            echo "Attempt $i: not ready yet, waiting 5s..."
            sleep 5
          done

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.11.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-I'
          fail_action: false

      - name: Upload ZAP DAST Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dast-report
          path: report_html.html

